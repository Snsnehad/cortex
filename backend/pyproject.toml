[project]
name = "cortex-backend"
version = "0.1.0"
description = "Cortex - multi-tenant AI knowledge & research engine (backend)"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the task that first needs them (see TECH_STACK.md).
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.12",
    "celery[redis]>=5.7.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# This is an application, not a library: no wheel is built. `app` is imported from the
# backend/ directory (pytest `pythonpath`, uvicorn/celery working directory, Docker WORKDIR).
package = false
# The uv cache lives on C: and the project on D:; hardlinks cannot cross drives.
link-mode = "copy"

# --------------------------------------------------------------------------------------
# Ruff: linter + formatter
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade (modern syntax for 3.12)
    "B",        # bugbear (likely bugs)
    "C4",       # comprehensions
    "SIM",      # simplifications
    "S",        # bandit (security)
    "DTZ",      # timezone-naive datetimes are bugs (guideline: UTC-aware only)
    "T20",      # no print(); use structured logging
    "PT",       # pytest style
    "ASYNC",    # blocking calls inside async functions
    "BLE",      # blind `except Exception`
    "RET",      # return consistency
    "PTH",      # pathlib over os.path (Windows-safe paths)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "S105", "S106",  # hard-coded test passwords/tokens are fine in tests
    "S311",     # seeded random.Random makes randomized code reproducible in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# --------------------------------------------------------------------------------------
# mypy: strict on application code, slightly relaxed for tests
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "migrations"]
# Generated revision files are reviewed by hand and formatted by ruff, not type-checked.
exclude = ["migrations/versions/"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Fixtures and parametrised tests often take untyped arguments; keep everything else strict.
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
# Warnings are errors: deprecations get fixed when they appear, not when they break.
filterwarnings = ["error"]
markers = [
    "integration: needs the Docker Compose services (PostgreSQL, Redis, Qdrant)",
    "slow: takes more than a few seconds",
    "eval: retrieval/answer evaluation runs (opt-in)",
    "llm: calls a real LLM endpoint (manual only, needs an API key)",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "moto[s3,server]>=5.2.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-randomly>=5.1.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
    "types-boto3[s3]>=1.44.12",
    "types-pyyaml>=6.0.12.20261122",
]

# Alembic configuration for Cortex (TASK-02.02).
#
# Run from backend/ (or use scripts\dev.cmd migrate / revision):
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "add documents table"
#
# There is deliberately NO sqlalchemy.url here: migrations connect with the same CORTEX_*
# settings as the application (see migrations/env.py), so credentials live in one place.
# Logging also goes through the application's structured logging pipeline.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# 20261126_1432-3f9c2a1b7e4d_add_documents_table.py: sortable by date, readable slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC

[post_write_hooks]
# New revision files are formatted and lint-fixed with ruff automatically.
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME

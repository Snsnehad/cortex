# Cortex — local development infrastructure (TASK-01.04)
#
# Run from the repository root:
#   docker compose -f infra/compose/docker-compose.yml up -d --wait
# With a root .env (credentials/ports), add:  --env-file .env
#
# Credentials and ports are read from the same CORTEX_* variables the backend uses, with
# defaults that match .env.example, so the app and the containers always agree.
# Ports are bound to 127.0.0.1 only: nothing here is reachable from your network.
# Host ports use a Cortex-specific block (15432, 16379, 16333/16334) so they never clash
# with other local projects on the default 5432 / 6379 / 6333; inside Docker the
# services keep their standard ports.
#
# Application containers are opt-in via the "app" profile, because day-to-day development
# runs the API on the host with --reload:
#   docker compose -f infra/compose/docker-compose.yml --profile app up -d --build --wait
# The containerised API listens on http://127.0.0.1:18000.
#
# Background worker and scheduler (TASK-05.06) are opt-in too, via the "workers" profile:
#   scripts\dev.cmd workers up      (or: docker compose ... --profile workers up -d worker beat)
# They are kept small on purpose (memory limits below): one worker process, recycled every
# 50 tasks so its memory cannot creep up. Raise worker.mem_limit when the embedding model
# arrives (Phase 7).

name: cortex

# Shared by every backend container (api, worker, beat): one image, the same settings and
# the same hardening. Inside the compose network services are reached by name on their
# standard ports, so the host-oriented values from .env (127.0.0.1:15432, …) are overridden.
x-backend: &backend
  build:
    context: ../../backend
  image: cortex-backend:dev
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  environment:
    CORTEX_ENVIRONMENT: development
    CORTEX_DATABASE__HOST: postgres
    CORTEX_DATABASE__PORT: "5432"
    CORTEX_DATABASE__USER: ${CORTEX_DATABASE__USER:-cortex}
    CORTEX_DATABASE__PASSWORD: ${CORTEX_DATABASE__PASSWORD:-cortex}
    CORTEX_DATABASE__NAME: ${CORTEX_DATABASE__NAME:-cortex}
    CORTEX_REDIS__URL: redis://redis:6379/0
    CORTEX_QDRANT__URL: http://qdrant:6333
    CORTEX_WORKER__BROKER_URL: redis://redis:6379/1
  volumes:
    - storage_data:/data/storage
  # Hardening: immutable root filesystem, no Linux capabilities, no privilege escalation.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CORTEX_DATABASE__USER:-cortex}
      POSTGRES_PASSWORD: ${CORTEX_DATABASE__PASSWORD:-cortex}
      POSTGRES_DB: ${CORTEX_DATABASE__NAME:-cortex}
    command:
      - postgres
      # Query statistics for bottleneck analysis (TASK-14.06)
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      # Log statements slower than 500 ms
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:${CORTEX_DATABASE__PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Checks over TCP (-h 127.0.0.1) so it only passes once the server accepts real
      # connections, not just during the init-time Unix-socket-only phase.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command:
      - redis-server
      # Persist the Celery queue across restarts
      - --appendonly
      - "yes"
      # A task broker must never evict keys: fail writes instead of losing jobs
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    # Runs as a non-root user (unprivileged variant)
    image: qdrant/qdrant:v1.20.2-unprivileged
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:16333:6333" # HTTP / REST
      - "127.0.0.1:16334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships without curl/wget, so issue the HTTP request with bash's /dev/tcp
      # and require "200" from the /readyz endpoint.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    <<: *backend
    profiles: ["app"]
    ports:
      - "127.0.0.1:18000:8000"
    # Health check is defined in the Dockerfile (liveness on /api/v1/health/live).

  worker:
    <<: *backend
    profiles: ["workers"]
    # One process; recycled after 50 tasks (caps slow memory growth); no startup banner.
    # (--quiet is a top-level celery option: it must come before the subcommand.)
    command:
      - celery
      - --quiet
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --max-tasks-per-child=50
    mem_limit: 512m
    # Warm shutdown: the running task may finish. Anything still unfinished after this is
    # requeued (acks_late + reject_on_worker_lost), never lost.
    stop_grace_period: 60s
    # The image's health check polls the API port, which a worker does not serve; a
    # Celery-based check would start a whole Python process every interval (RAM churn).
    healthcheck:
      disable: true

  beat:
    <<: *backend
    profiles: ["workers"]
    # Exactly one beat may run. Its schedule state lives on the tmpfs (/tmp), so the
    # read-only root filesystem stays read-only.
    command:
      - celery
      - --quiet
      - -A
      - app.workers.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    mem_limit: 192m
    stop_grace_period: 10s
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  storage_data:
